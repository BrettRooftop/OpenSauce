ref=\"https://www.facebook.com/privacy/policies/cookies/?annotations[0]=explanation%2F3_companies_list\" target=\"_blank\">other companies\x3C/a> in order to show you ads off our Products, and provide features such as maps, payment services and video.\x3C/div>\x3Cdiv>\x3Clabel class=\"_9nq9 _9si_\">\x3Cinput name=\"\" id=\"granular_control_header_toggle\" class=\"_9nqa _9sj1\" type=\"checkbox\" value=\"false\" />\x3Cspan class=\"_9nqb _9sj0\">\x3C/span>\x3C/label>\x3C/div>\x3C/div>\x3Cdiv style=\"margin-bottom: 0;\">\x3Cdiv class=\"_aqp-\" title=\"Choose cookies by category\" id=\"u_0_i_lB\">\x3Cdiv class=\"_al5f\">Choose cookies by category\x3C/div>\x3Ci class=\"img sp_M-AstDWg75z_3x sx_64b9b8\">\x3C/i>\x3C/div>\x3C/div>\x3C/div>\x3Cdiv>\x3Cdiv class=\"_9vtg\" id=\"u_0_j_ET\">\x3Cbutton class=\"_al9c _9nge\" title=\"expandable section\">\x3Cdiv class=\"_9ngc\">\x3Cspan class=\"_9ngf\">\x3Cdiv class=\"_al5f\">How we use these cookies\x3C/div>\x3C/span>\x3Cspan class=\"_9ngg _9v7v\">\x3Ci class=\"img sp_M-AstDWg75z_3x sx_64b9b8\">\x3C/i>\x3C/span>\x3C/div>\x3C/button>\x3Cdiv class=\"_9ngb _9nga\">\x3Cdiv>\x3Cdiv class=\"_als7\">We use cookies from other companies on our Products:\x3C/div>\x3Cdiv class=\"_al5g\">\x3Cul class=\"_al51\">\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">To show you ads about our Products and features on other companies&#039; apps and websites.\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">To provide features on our Products such as maps, payment services and video.\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">For analytics.\x3C/span>\x3C/li>\x3C/ul>\x3C/div>\x3C/div>\x3C/div>\x3C/div>\x3Cdiv class=\"_9vtg\" id=\"u_0_k_9o\">\x3Cbutton class=\"_al9c _9nge\" title=\"expandable section\">\x3Cdiv class=\"_9ngc\">\x3Cspan class=\"_9ngf\">\x3Cdiv class=\"_al5f\">If you allow these cookies\x3C/div>\x3C/span>\x3Cspan class=\"_9ngg _9v7v\">\x3Ci class=\"img sp_M-AstDWg75z_3x sx_64b9b8\">\x3C/i>\x3C/span>\x3C/div>\x3C/button>\x3Cdiv class=\"_9ngb _9nga\">\x3Cdiv>\x3Cdiv class=\"_als7\">\x3C/div>\x3Cdiv class=\"_al5g\">\x3Cul class=\"_al51\">\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">Features that you use on Meta Products will not be affected.\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">We&#039;ll be able to better personalise ads for you off Meta Products, and measure their performance.\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">Other companies will receive information about you by using their cookies.\x3C/span>\x3C/li>\x3C/ul>\x3C/div>\x3C/div>\x3C/div>\x3C/div>\x3Cdiv class=\"_9vtg\" id=\"u_0_l_e+\">\x3Cbutton class=\"_al9c _9nge\" title=\"expandable section\">\x3Cdiv class=\"_9ngc\">\x3Cspan class=\"_9ngf\">\x3Cdiv class=\"_al5f\">If you don&#039;t allow these cookies\x3C/div>\x3C/span>\x3Cspan class=\"_9ngg _9v7v\">\x3Ci class=\"img sp_M-AstDWg75z_3x sx_64b9b8\">\x3C/i>\x3C/span>\x3C/div>\x3C/button>\x3Cdiv class=\"_9ngb _9nga\">\x3Cdiv>\x3Cdiv class=\"_als7\">\x3C/div>\x3Cdiv class=\"_al5g\">\x3Cul class=\"_al51\">\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">Some features on our products may not work.\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">We won&#039;t use cookies from other companies to personalise ads for you off Meta products, or measure their performance.\x3C/span>\x3C/li>\x3C/ul>\x3C/div>\x3C/div>\x3C/div>\x3C/div>\x3C/div>\x3C/div>\x3Cdiv>\x3Cdiv class=\"_9xo0\">\x3C/div>\x3Ch2>Other ways you can control your information\x3C/h2>\x3Cdiv class=\"_9vtg\" id=\"u_0_m_j1\">\x3Cbutton class=\"_al9c _9nge\" title=\"expandable section\">\x3Cdiv class=\"_9ngc\" style=\"align-items: center;\">\x3Cspan class=\"_9ngf\">\x3Cdiv class=\"_al5f\">Manage your ad experience in Accounts Centre\x3C/div>\x3C/span>\x3Cspan class=\"_9ngg _9v7v\">\x3Ci class=\"img sp_M-AstDWg75z_3x sx_64b9b8\">\x3C/i>\x3C/span>\x3C/div>\x3C/button>\x3Cdiv class=\"_9ngb _9nga\">\x3Cdiv>\x3Cdiv style=\"margin-top: 16px\">\x3Cdiv>\x3Cp>You can manage your ad experience by visiting the following settings.\x3C/p>\x3Cp class=\"_am37\">Ad preferences\x3C/p>\x3Cp>In your ad preferences, you can choose whether we show you ads and make choices about the information used to show you ads.\x3C/p>\x3Cp class=\"_am37\">Ad settings\x3C/p>\x3Cp>If we show you ads, we use data that advertisers and other partners provide us with about your activity off Meta Company Products, including websites and apps, to show you better ads. You can control whether we use this data to show you ads in your \x3Ca href=\"https://www.facebook.com/settings/ads/\" target=\"_blank\">ad settings\x3C/a>.\x3C/p>\x3C/div>\x3C/div>\x3C/div>\x3C/div>\x3C/div>\x3Cdiv class=\"_9vtg\" id=\"u_0_n_Lt\">\x3Cbutton class=\"_al9c _9nge\" title=\"expandable section\">\x3Cdiv class=\"_9ngc\" style=\"align-items: center;\">\x3Cspan class=\"_9ngf\">\x3Cdiv class=\"_al5f\">More information about online advertising\x3C/div>\x3C/span>\x3Cspan class=\"_9ngg _9v7v\">\x3Ci class=\"img sp_M-AstDWg75z_3x sx_64b9b8\">\x3C/i>\x3C/span>\x3C/div>\x3C/button>\x3Cdiv class=\"_9ngb _9nga\">\x3Cdiv>\x3Cdiv style=\"margin-top: 16px\">\x3Cdiv>\x3Cp>You can opt out of seeing online interest-based ads from Meta and other participating companies through the \x3Ca href=\"https://lm.facebook.com/l.php?u=https%3A%2F%2Foptout.aboutads.info%2F&amp;h=AUBb_xn53yduw6zTTpm2c1-aYYDgAJwRW9ww3A-8PLcDvxBWYXyVeOycEu88TgjHO-Xq-GO1_4VcN0YoMev9274VZjIHbCwA-G_fa3fU0UNR6CAoM_tdol2F4IL7k3s4i6h9PSXIGEkQgp6qIhNM6a410L8vYWIp\" target=\"_blank\" rel=\"nofollow\" data-lynx-mode=\"origin\">Digital Advertising Alliance\x3C/a> in the US, the \x3Ca href=\"https://lm.facebook.com/l.php?u=https%3A%2F%2Fyouradchoices.ca%2F&amp;h=AUA1DeZpIsWXGISlSnqnvNrF860CTYno0AuNiNiwh1Pi5F3FvJtZoEDj_xdgwjWMD2UUJja5juVnqOagyC0hTjSLtS2QiKAJD06LyQowj6CEl79NMwVwh91lGv8bqPBmU97Er-xzCrEbNgCZyDUuqEU_z5TQg5Gk\" target=\"_blank\" rel=\"nofollow\" data-lynx-mode=\"origin\">Digital Advertising Alliance of Canada\x3C/a> in Canada or the \x3Ca href=\"https://lm.facebook.com/l.php?u=https%3A%2F%2Fwww.youronlinechoices.com%2F&amp;h=AUDy7bR0ct3S2a15gTxFkgxpLah1V6igjoLsYnQSvuckLQFrBc3nOO8kEalxFFdNYb83Di_fpEB3Cfu6lqjAzsYsA2GezDdJuZ1lUiF8EtRsnPNjwxdha3jVjuZegaGGdrSdM9Os11z85xVM6ud6xHucSJ109ntN\" target=\"_blank\" rel=\"nofollow\" data-lynx-mode=\"origin\">European Interactive Digital Advertising Alliance\x3C/a> in Europe, or through your mobile device settings, if you are using Android, iOS 13 or an earlier version of iOS. Please note that ad blockers and tools that restrict our cookie use may interfere with these controls.\x3C/p>\x3C/div>\x3C/div>\x3C/div>\x3C/div>\x3C/div>\x3Cdiv class=\"_9vtg\" id=\"u_0_o_Z6\">\x3Cbutton class=\"_al9c _9nge\" title=\"expandable section\">\x3Cdiv class=\"_9ngc\" style=\"align-items: center;\">\x3Cspan class=\"_9ngf\">\x3Cdiv class=\"_al5f\">Controlling cookies with browser settings\x3C/div>\x3C/span>\x3Cspan class=\"_9ngg _9v7v\">\x3Ci class=\"img sp_M-AstDWg75z_3x sx_64b9b8\">\x3C/i>\x3C/span>\x3C/div>\x3C/button>\x3Cdiv class=\"_9ngb _9nga\">\x3Cdiv>\x3Cdiv style=\"margin-top: 16px\">\x3Cdiv>\x3Cp>Your browser or device may offer settings that allow you to choose whether browser cookies are set and to delete them. These controls vary by browser, and manufacturers may change both the settings they make available and how they work at any time. As of 5 October 2020, you may find additional information about the controls offered by popular browsers at the links below. Certain parts of Meta Products may not work properly if you have disabled browser cookies. Please be aware that these controls are distinct from the controls that Facebook offers.\x3C/p>\x3Cul class=\"_9o-q\">\x3Cli>\x3Ca href=\"https://lm.facebook.com/l.php?u=https%3A%2F%2Fsupport.google.com%2Fchrome%2Fanswer%2F95647&amp;h=AUCaJNU5SFzYQp83UO81hTKsyYvIpdj2_y6-3VJUuEs0uZj1gDrQnkSmOFDOEOYGmsOFT5kot6MO9EZybBIVPqTH2bdv4sj1t4M0BvKf0Y1eLrVEL9IxsJ6_6IwKYv3UNtI1Rte0UnvofpKYbYl_IglSpmlQcNqN\" target=\"_blank\" rel=\"nofollow\" data-lynx-mode=\"origin\">Google Chrome\x3C/a>\x3C/li>\x3Cli>\x3Ca href=\"https://lm.facebook.com/l.php?u=https%3A%2F%2Fsupport.microsoft.com%2Fen-ie%2Fhelp%2F17442%2Fwindows-internet-explorer-delete-manage-cookies&amp;h=AUCXLHOCwxH-DzMQq8K9kbDREDK_qkMkVZJemrKWqmHPUnYpWnwY1PFu5rToURw1G2utMWa5tobc5Jyyr1qD1PSm0bMmO2W6rb6r-UYj1GIOCJbbNuC_Eea_KPbba_oXL52ctkrsj7VVESFGaJnV5moSrwDRCYTb\" target=\"_blank\" rel=\"nofollow\" data-lynx-mode=\"origin\">Internet Explorer\x3C/a>\x3C/li>\x3Cli>\x3Ca href=\"https://lm.facebook.com/l.php?u=https%3A%2F%2Fsupport.mozilla.org%2Fen-US%2Fkb%2Fenable-and-disable-cookies-website-preferences&amp;h=AUC1ZQ5Q6pwhLrSHUek91XUuXHqtH8YVpoXUu-PyXqWBRRDRvegLvys9VjXN_RmlW83x7OCXh8QEgHf_ZebbvU11u4FswsZ6YoeiiEI5NWzONC5GQEkSUFgPpjW9uAzoRm1a9zWetG30XJY5HkgxR23PVQZladXm\" target=\"_blank\" rel=\"nofollow\" data-lynx-mode=\"origin\">Firefox\x3C/a>\x3C/li>\x3Cli>\x3Ca href=\"https://lm.facebook.com/l.php?u=https%3A%2F%2Fsupport.apple.com%2Fen-ie%2Fguide%2Fsafari%2Fsfri11471%2Fmac&amp;h=AUCQPdWHFTMy0ceE_OYyfuQV0xjyw0tmUAkfRmt_A9lR3xDHAYaqgi4bt0p6_Gs7F2h3pwg3r0Uqmaak8DZoEpewm5xGR7A4lLGcQnTu-5-0VOEdVkYpuvKghulf_NWmhv63aD_pk91hqFcLo8r2iJkrSANRR3y6\" target=\"_blank\" rel=\"nofollow\" data-lynx-mode=\"origin\">Safari\x3C/a>\x3C/li>\x3Cli>\x3Ca href=\"https://lm.facebook.com/l.php?u=https%3A%2F%2Fsupport.apple.com%2Fen-us%2FHT201265&amp;h=AUDXWy1ltZgdEBLOXw52gd5LrUUlALzfR1RK9YEwjRY026dLdjo_zX4XysVhDZWI_pOEug9Fsl6SKT2Y94oDvNdyjnMWkyez-ZWFhH1-mcGEx_ys8miWNlnHzlsNrcb_LXMa-qNd_zyOjTOGTA3JsuKY2YFCw6Ou\" target=\"_blank\" rel=\"nofollow\" data-lynx-mode=\"origin\">Safari mobile\x3C/a>\x3C/li>\x3Cli>\x3Ca href=\"https://lm.facebook.com/l.php?u=https%3A%2F%2Fblogs.opera.com%2Fnews%2F2015%2F08%2Fhow-to-manage-cookies-in-opera%2F&amp;h=AUC4BP0o2X_bOSx8S8ZEmUcXSyC-n7aPBkpoPDMLPMw51Oc3Qmslj2O6yu3W3e7PZravEyJ9GiY9TzqNfXz-2PpGSDUIuQO-0Fc3QaptS5oY09OvyVUPxsCGChvmHNiJoxM29OHvCDu2uM8poeefjaWWaqcXcBsj\" target=\"_blank\" rel=\"nofollow\" data-lynx-mode=\"o ty of our Products.\x3C/p>\x3Cp>Learn more about cookies and the similar technologies that we use in our \x3Ca href=\"https://www.facebook.com/privacy/policies/cookies\" id=\"cpn-pv-link\" target=\"_blank\">Cookies Policy\x3C/a>.\x3C/p>\x3C/div>\x3C/div>\x3Cdiv>\x3C/div>\x3C/div>\x3C/div>\x3Cdiv class=\"_al7c _al7i\" id=\"cookie_popup_2\">\x3Cdiv class=\"_am3h\" id=\"u_0_s_U6\">\x3C/div>\x3Cdiv class=\"_al7d\">\x3Cdiv class=\"_ala5\">\x3Cbutton class=\"_al7e\" id=\"u_0_t_b8\">\x3Ci class=\"img sp_M-AstDWg75z_3x sx_5e37fa\">\x3C/i>\x3C/button>\x3C/div>\x3Cdiv class=\"_ala8\" data-sigil=\"m-overlay-scrollable\">\x3Cdiv class=\"_ala6\">\x3Cimg src=\"https://www.facebook.com/images/cookies/cookie_info_popup_image_2.png\" alt=\"background image\" class=\"_al7f\" />\x3C/div>\x3Cdiv class=\"_al7g\">\x3Ch2>Why do we use cookies?\x3C/h2>\x3Cp>Cookies help us provide, protect and improve the Meta Products, such as by personalising content, tailoring and measuring ads, and providing a safer experience.\x3C/p>\x3Cp>While the cookies that we use may change from time to time as we improve and update the Meta Products, we use them for the following purposes:\x3C/p>\x3Cdiv class=\"_al80\">\x3Cul class=\"_al51\">\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">Authentication to keep users logged in\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">To ensure security, site and product integrity\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">To provide advertising, recommendations, insights and measurement, if we show you ads\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">To provide site features and services\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">To understand our Products&#039; performance\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">To enable analytics and research\x3C/span>\x3C/li>\x3Cli class=\"_al52\">\x3Cspan class=\"_al53\">On third-party websites and apps to help companies that inc
